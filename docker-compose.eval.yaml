services:
  shell-decider-eval:
    labels:
      matoloop.dev.worktree: ${MATO_LOOP_DEV_WORKTREE:?Use ./scripts/eval.sh}
      matoloop.dev.repository: ${MATO_LOOP_DEV_REPOSITORY:?Use ./scripts/eval.sh}
    profiles: [evaluation]
    build:
      context: ./scripts/shell-decider-eval
    init: true
    cpus: 8
    mem_limit: 12g
    environment:
      HF_HOME: /cache/huggingface
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTHONPATH: /source/apps/matoloop-agent/src
      PYTHONDONTWRITEBYTECODE: "1"
      OMP_NUM_THREADS: "8"
      OPENBLAS_NUM_THREADS: "8"
    volumes:
      - .:/source:ro
      - ./data/shell-decider-eval:/results
      - type: volume
        source: download_cache
        target: /cache/huggingface/hub
        volume:
          subpath: embedding
          nocopy: true
    working_dir: /source/scripts/shell-decider-eval
    entrypoint: [python, -u, evaluate.py]
    networks:
      - mato-loop
