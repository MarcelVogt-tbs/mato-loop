site_name: MatoLoop Dokumentation
site_description: Benutzer- und Administrationshandbuch für MatoLoop
site_url: ""

docs_dir: docs/user

theme:
  name: material
  language: de
  logo: assets/images/matoloop.svg
  favicon: assets/images/matoloop.svg
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Zum Dunkelmodus wechseln
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Zum Hellmodus wechseln
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

extra_css:
  - assets/stylesheets/theme.css

nav:
  - Startseite: index.md
  - Einstieg:
      - Schnellstart: schnellstart.md
      - Anmeldung und Oberfläche: anmeldung-und-oberflaeche.md
  - Arbeiten mit MatoLoop:
      - Chat und Sessions: chat-und-sessions.md
      - Dateien und Arbeitsordner: dateien-und-arbeitsordner.md
      - Anhänge, Diktat und Medien: anhaenge-und-medien.md
      - Webrecherche und Quellen: webrecherche-und-quellen.md
      - Freigaben und Datenfreigabe: freigaben-und-datenfreigabe.md
      - Variablen und Secrets: variablen-und-secrets.md
      - Automationen: automationen.md
      - Kanäle: kanaele.md
  - Personalisierung:
      - Personalisierung: persona.md
      - Skills: skills.md
      - Memory und Dreaming: memory-und-dreaming.md
  - Konfiguration:
      - Provider und Modelle: provider-und-modelle.md
      - Tools und Integrationen: tools-und-integrationen.md
  - Administration und Betrieb:
      - Betrieb und Datensicherung: betrieb-und-datensicherung.md
      - Debug-Zugang: debug-zugang.md
  - Hilfe:
      - Häufige Fragen: haeufige-fragen.md
      - Changelog: changelog.md

plugins:
  - search:
      lang: de

markdown_extensions:
  - tables
  - fenced_code
  - admonition
  - attr_list
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
