[project]
name = "matoloop-teams-protocol"
version = "0.1.0"
description = "Typed wire contract for the MatoLoop Teams relay"
requires-python = ">=3.12,<3.14"
license = "AGPL-3.0-only"
dependencies = ["pydantic>=2.11,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matoloop_teams_protocol"]
