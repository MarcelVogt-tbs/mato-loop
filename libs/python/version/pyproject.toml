[project]
name = "matoloop-version"
version = "0.1.0"
description = "Shared MatoLoop source version"
requires-python = ">=3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matoloop_version"]

[tool.hatch.build]
artifacts = ["src/matoloop_version/build-version.txt"]
