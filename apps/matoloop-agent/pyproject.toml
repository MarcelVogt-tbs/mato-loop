[project]
name = "matoloop-agent"
version = "0.1.0"
description = "Standalone MatoLoop Agent"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx>=0.28.1,<1",
    "pydantic>=2.11,<3",
    "websockets>=15,<17",
]

[project.scripts]
matoloop-agent = "matoloop_agent.__main__:main"

[dependency-groups]
build = ["pyinstaller>=6.11,<7"]
dev = ["ruff>=0.14.11,<0.15"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matoloop_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]
