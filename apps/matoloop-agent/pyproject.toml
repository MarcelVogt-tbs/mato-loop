[project]
name = "matoloop-agent"
version = "0.1.0"
description = "Standalone MatoLoop Agent"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12,<3.14"
dependencies = [
    "matoloop-version",
    "httpx>=0.28.1,<1",
    "pydantic>=2.11,<3",
    "tree-sitter>=0.25,<0.27",
    "tree-sitter-bash>=0.25,<0.26",
    "websockets>=15,<17",
]

[project.scripts]
matoloop-agent = "matoloop_agent.__main__:main"

[dependency-groups]
browser = ["pillow>=12.1.1,<13", "playwright==1.59.0"]
dev = [
    { include-group = "browser" },
    "ruff>=0.14.11,<0.15",
    "watchfiles>=1.1,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
matoloop-version = { path = "../../libs/python/version", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/matoloop_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]
