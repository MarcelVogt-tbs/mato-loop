[project]
name = "mato-loop-backend"
version = "0.1.0"
description = "MatoLoop FastAPI backend"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "aiohttp>=3.12.0",
    "alembic>=1.16.0",
    "asyncpg>=0.30.0",
    "beautifulsoup4>=4.13.0",
    "cryptography>=45.0.0",
    "fastapi>=0.116.0",
    "httpx>=0.28.1",
    "markdownify>=1.2.0",
    "openai>=2.8.0",
    "pillow>=11.3.0",
    "pgvector>=0.5.0,<0.6.0",
    "pydantic-settings>=2.10.0",
    "pwdlib[argon2]>=0.2.1",
    "sqlalchemy[asyncio]>=2.0.41",
    "uvicorn[standard]>=0.35.0",
    "yarl>=1.20.0",
    "presidio-analyzer>=2.2.0",
    "de-core-news-sm",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mato_loop_backend"]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["mato_loop_backend"]
known-third-party = ["alembic"]

[tool.uv.sources]
de-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/de_core_news_sm-3.8.0/de_core_news_sm-3.8.0-py3-none-any.whl" }
