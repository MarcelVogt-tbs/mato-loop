[project]
name = "matoloop-teams-relay"
version = "0.1.0"
description = "Outbound-only messaging gateway between Microsoft Teams and MatoLoop"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "AGPL-3.0-only"
dependencies = [
    "matoloop-teams-protocol",
    "fastapi>=0.116,<1",
    "httpx>=0.28.1,<1",
    "microsoft-teams-apps==2.2.1",
    "pydantic-settings>=2.11,<3",
    "uvicorn>=0.35,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
matoloop-teams-protocol = { path = "../../libs/python/teams-relay", editable = true }

[dependency-groups]
dev = ["pytest>=8.4", "pytest-asyncio>=1", "ruff>=0.12"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]
ignore = ["E501"]

[tool.hatch.build.targets.wheel]
packages = ["src/matoloop_teams_relay"]
