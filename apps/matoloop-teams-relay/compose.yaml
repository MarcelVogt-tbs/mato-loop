services:
  relay:
    build:
      context: ../..
      dockerfile: apps/matoloop-teams-relay/Dockerfile
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      MATO_TEAMS_APP_ID: ${MATO_TEAMS_APP_ID:?Set the Microsoft app ID}
      MATO_TEAMS_TENANT_ID: ${MATO_TEAMS_TENANT_ID:?Set the Microsoft tenant ID}
      MATO_TEAMS_CLIENT_SECRET_FILE: /run/secrets/client_secret
      MATO_TEAMS_RELAY_TOKEN_FILE: /run/secrets/relay_token
      MATO_TEAMS_SPOOL_DIR: /spool
    secrets: [client_secret, relay_token]
    volumes:
      - spool:/spool
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,uid=10001,gid=10001
    ports:
      - "127.0.0.1:${MATO_TEAMS_HOST_PORT:-3978}:3978"
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3978/health', timeout=5).close()"]
      interval: 30s
      timeout: 10s
      retries: 3

secrets:
  client_secret:
    file: ${MATO_TEAMS_SECRET_DIRECTORY:?Set an absolute secret directory}/client-secret
  relay_token:
    file: ${MATO_TEAMS_SECRET_DIRECTORY:?Set an absolute secret directory}/relay-token

volumes:
  spool:
