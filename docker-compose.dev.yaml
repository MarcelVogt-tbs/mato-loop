name: ${MATO_LOOP_COMPOSE_PROJECT_NAME:-${MATO_LOOP_DEV_PROJECT_NAME:?Use ./scripts/dev.sh}}

x-dev-volume: &dev-volume
  labels:
    matoloop.dev.worktree: ${MATO_LOOP_DEV_WORKTREE:?Use ./scripts/dev.sh}
    matoloop.dev.repository: ${MATO_LOOP_DEV_REPOSITORY:?Use ./scripts/dev.sh}

services:
  storage-init:
    <<: *dev-volume
    image: node:22-bookworm-slim
    profiles: [storage]
    network_mode: none
    volumes:
      - app_data:/app-data
      - dev_data:/dev-data
      - download_cache:/download-cache
    entrypoint: [sh, -eu, -c]
    command:
      - >-
        mkdir -p /app-data/backend /app-data/agent/state /app-data/agent/workspace
        /dev-data/backend /dev-data/agent /dev-data/frontend/node_modules
        /dev-data/frontend/quasar /dev-data/frontend/dist /dev-data/frontend/yarn
        /download-cache/uv /download-cache/yarn /download-cache/embedding;
        chmod 755 /download-cache /download-cache/embedding

  db:
    <<: *dev-volume
    image: pgvector/pgvector:0.8.5-pg17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - mato-loop

  embedding:
    <<: *dev-volume
    image: michaelf34/infinity:0.0.77-cpu
    restart: unless-stopped
    environment:
      INFINITY_ANONYMOUS_USAGE_STATS: "0"
      TOKENIZERS_PARALLELISM: "false"
    command:
      [
        "v2",
        "--model-id",
        "intfloat/multilingual-e5-small",
        "--served-model-name",
        "matoloop-memory",
        "--revision",
        "614241f622f53c4eeff9890bdc4f31cfecc418b3",
        "--engine",
        "torch",
        "--device",
        "cpu",
        "--batch-size",
        "16",
        "--model-warmup",
        "--no-trust-remote-code",
        "--no-vector-disk-cache",
        "--port",
        "7997",
      ]
    volumes:
      - type: volume
        source: download_cache
        target: /app/.cache/huggingface/hub
        volume:
          subpath: embedding
          nocopy: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7997/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10m
    networks:
      - mato-loop

  backend:
    <<: *dev-volume
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    env_file:
      - path: .env.dev
        required: true
      - path: .env.dev.override
        required: false
    environment:
      UV_PROJECT_ENVIRONMENT: /opt/mato-loop/backend/venv
      UV_CACHE_DIR: /opt/mato-loop/backend/uv-cache
      UV_LINK_MODE: copy
      PYTHONPYCACHEPREFIX: /tmp/python-cache
      PYTEST_ADDOPTS: -o cache_dir=/tmp/pytest-cache
      RUFF_CACHE_DIR: /tmp/ruff-cache
      MATO_LOOP_DATA_DIR: /data
      MATO_LOOP_STATIC_DIR: /tmp/mato-loop-static
      MATO_LOOP_BIND_BACKEND_PORT: ${MATO_LOOP_BIND_BACKEND_PORT:-6020}
      MATO_LOOP_SESSION_COOKIE_NAME: ${MATO_LOOP_SESSION_COOKIE_NAME:-${COMPOSE_PROJECT_NAME}_session}
    volumes:
      - .:/workspace
      - type: volume
        source: app_data
        target: /data
        volume:
          subpath: backend
          nocopy: true
      - type: volume
        source: dev_data
        target: /opt/mato-loop/backend
        volume:
          subpath: backend
          nocopy: true
      - type: volume
        source: download_cache
        target: /opt/mato-loop/backend/uv-cache
        volume:
          subpath: uv
          nocopy: true
    ports:
      - "${MATO_LOOP_HOST_BACKEND_PORT:-0}:${MATO_LOOP_BIND_BACKEND_PORT:-6020}"
    depends_on:
      db:
        condition: service_healthy
    working_dir: /workspace/apps/backend
    command:
      [
        "sh",
        "-c",
        "uv sync --frozen --group docs && uv run --no-sync mkdocs build --strict --config-file /workspace/mkdocs.yml --site-dir /tmp/mato-loop-static/docs && rm -f /tmp/mato-loop-static/docs/404.html && uv run alembic upgrade head && exec uv run uvicorn mato_loop_backend.app:app --host 0.0.0.0 --port $${MATO_LOOP_BIND_BACKEND_PORT:-6020} --reload --reload-dir src --timeout-graceful-shutdown 5",
      ]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${MATO_LOOP_BIND_BACKEND_PORT:-6020}/api/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks:
      - mato-loop

  frontend:
    <<: *dev-volume
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      MATO_LOOP_BIND_BACKEND_PORT: ${MATO_LOOP_BIND_BACKEND_PORT:-6020}
      MATO_LOOP_BIND_FRONTEND_PORT: ${MATO_LOOP_BIND_FRONTEND_PORT:-10020}
      QUASAR_API_PROXY_TARGET: http://backend:${MATO_LOOP_BIND_BACKEND_PORT:-6020}
      MATO_LOOP_FRONTEND_MODE: ${MATO_LOOP_FRONTEND_MODE:-spa}
      YARN_ENABLE_GLOBAL_CACHE: "true"
      YARN_GLOBAL_FOLDER: /opt/mato-loop/yarn
    volumes:
      - .:/workspace
      - type: volume
        source: dev_data
        target: /workspace/apps/frontend/node_modules
        volume:
          subpath: frontend/node_modules
          nocopy: true
      - type: volume
        source: dev_data
        target: /workspace/apps/frontend/.quasar
        volume:
          subpath: frontend/quasar
          nocopy: true
      - type: volume
        source: dev_data
        target: /workspace/apps/frontend/dist
        volume:
          subpath: frontend/dist
          nocopy: true
      - type: volume
        source: dev_data
        target: /workspace/apps/frontend/.yarn
        volume:
          subpath: frontend/yarn
          nocopy: true
      - type: volume
        source: download_cache
        target: /opt/mato-loop/yarn
        volume:
          subpath: yarn
          nocopy: true
    ports:
      - "${MATO_LOOP_HOST_FRONTEND_PORT:-0}:${MATO_LOOP_BIND_FRONTEND_PORT:-10020}"
    depends_on:
      backend:
        condition: service_healthy
    working_dir: /workspace/apps/frontend
    command:
      [
        "sh",
        "-c",
        "yarn install --immutable && if [ \"$${MATO_LOOP_FRONTEND_MODE:-spa}\" = pwa ]; then exec yarn dev -m pwa --host 0.0.0.0 --port $${MATO_LOOP_BIND_FRONTEND_PORT:-10020}; else exec yarn dev --host 0.0.0.0 --port $${MATO_LOOP_BIND_FRONTEND_PORT:-10020}; fi",
      ]
    networks:
      - mato-loop
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:' + process.env.MATO_LOOP_BIND_FRONTEND_PORT).then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  matoloop-agent:
    <<: *dev-volume
    image: ${MATOLOOP_AGENT_DEV_IMAGE:-${COMPOSE_PROJECT_NAME}-matoloop-agent-dev}
    build:
      context: ./apps/matoloop-agent
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    shm_size: 256mb
    security_opt:
      - no-new-privileges:true
      - seccomp:unconfined
    environment:
      UV_PROJECT_ENVIRONMENT: /opt/matoloop-agent/venv
      MATOLOOP_AGENT_CONTAINER: "1"
      UV_CACHE_DIR: /opt/matoloop-agent/uv-cache
      UV_LINK_MODE: copy
      PYTHONPYCACHEPREFIX: /tmp/python-cache
      RUFF_CACHE_DIR: /tmp/ruff-cache
      MATOLOOP_AGENT_BACKEND_URL: ws://backend:${MATO_LOOP_BIND_BACKEND_PORT:-6020}/api/execution-agents/connect
      MATOLOOP_AGENT_ID: ${MATOLOOP_AGENT_ID:-}
      MATOLOOP_AGENT_PAIRING_TOKEN: ${MATOLOOP_AGENT_PAIRING_TOKEN:-}
    volumes:
      - .:/source
      - type: volume
        source: app_data
        target: /data
        volume:
          subpath: agent/state
          nocopy: true
      - type: volume
        source: app_data
        target: /workspace
        volume:
          subpath: agent/workspace
          nocopy: true
      - type: volume
        source: dev_data
        target: /opt/matoloop-agent
        volume:
          subpath: agent
          nocopy: true
      - type: volume
        source: download_cache
        target: /opt/matoloop-agent/uv-cache
        volume:
          subpath: uv
          nocopy: true
    depends_on:
      backend:
        condition: service_healthy
    working_dir: /source/apps/matoloop-agent
    command:
      [
        "sh",
        "-c",
        "uv sync --frozen && exec uv run --no-sync watchfiles --filter python 'matoloop-agent run' src",
      ]
    networks:
      - mato-loop

volumes:
  app_data:
    labels:
      matoloop.dev.worktree: ${MATO_LOOP_DEV_WORKTREE:?Use ./scripts/dev.sh}
      matoloop.dev.repository: ${MATO_LOOP_DEV_REPOSITORY:?Use ./scripts/dev.sh}
      matoloop.dev.layout: consolidated-v1
  db_data:
    <<: *dev-volume
  dev_data:
    <<: *dev-volume
  download_cache:
    name: ${MATO_LOOP_DEV_CACHE_PREFIX:?Use ./scripts/dev.sh}-downloads-v1
    external: true

networks:
  mato-loop:
    <<: *dev-volume
    name: ${COMPOSE_PROJECT_NAME}_default
