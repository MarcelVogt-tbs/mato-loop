name: ${MATO_LOOP_COMPOSE_PROJECT_NAME:-mato-loop}

services:
  db:
    image: pgvector/pgvector:0.8.5-pg17-bookworm
    restart: unless-stopped
    env_file:
      - path: .env.default
        required: true
      - path: .env.dev
        required: true
      - path: .env.dev.override
        required: false
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - mato-loop

  embedding:
    image: michaelf34/infinity:0.0.77-cpu
    restart: unless-stopped
    environment:
      INFINITY_ANONYMOUS_USAGE_STATS: "0"
      TOKENIZERS_PARALLELISM: "false"
    command:
      [
        "v2",
        "--model-id",
        "intfloat/multilingual-e5-small",
        "--served-model-name",
        "matoloop-memory",
        "--revision",
        "614241f622f53c4eeff9890bdc4f31cfecc418b3",
        "--engine",
        "torch",
        "--device",
        "cpu",
        "--batch-size",
        "16",
        "--model-warmup",
        "--no-trust-remote-code",
        "--no-vector-disk-cache",
        "--port",
        "7997",
      ]
    volumes:
      - embedding_cache:/app/.cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7997/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10m
    networks:
      - mato-loop

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    env_file:
      - path: .env.default
        required: true
      - path: .env.dev
        required: true
      - path: .env.dev.override
        required: false
    environment:
      UV_PROJECT_ENVIRONMENT: /opt/mato-loop/backend/venv
      UV_CACHE_DIR: /opt/mato-loop/backend/uv-cache
      MATO_LOOP_DATA_DIR: /data
      MATO_LOOP_STATIC_DIR: /tmp/mato-loop-static
    volumes:
      - .:/workspace
      - app_data:/data
      - backend_uv_data:/opt/mato-loop/backend
    ports:
      - "${MATO_LOOP_HOST_BACKEND_PORT:-6020}:${MATO_LOOP_BIND_BACKEND_PORT:-6020}"
    depends_on:
      db:
        condition: service_healthy
    working_dir: /workspace/apps/backend
    command:
      [
        "sh",
        "-c",
        "uv sync --frozen --group docs && uv run --no-sync mkdocs build --strict --config-file /workspace/mkdocs.yml --site-dir /tmp/mato-loop-static/docs && rm -f /tmp/mato-loop-static/docs/404.html && uv run alembic upgrade head && exec uv run uvicorn mato_loop_backend.app:app --host 0.0.0.0 --port $${MATO_LOOP_BIND_BACKEND_PORT:-6020} --reload",
      ]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${MATO_LOOP_BIND_BACKEND_PORT:-6020}/api/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks:
      - mato-loop

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    env_file:
      - path: .env.default
        required: true
      - path: .env.dev
        required: true
      - path: .env.dev.override
        required: false
    environment:
      QUASAR_API_PROXY_TARGET: http://backend:${MATO_LOOP_BIND_BACKEND_PORT:-6020}
    volumes:
      - .:/workspace
      - frontend_node_modules:/workspace/apps/frontend/node_modules
      - frontend_yarn_cache:/opt/mato-loop/yarn-cache
    ports:
      - "${MATO_LOOP_HOST_FRONTEND_PORT:-10020}:${MATO_LOOP_BIND_FRONTEND_PORT:-10020}"
    depends_on:
      backend:
        condition: service_healthy
    working_dir: /workspace/apps/frontend
    command:
      [
        "sh",
        "-c",
        "yarn install --immutable && exec yarn dev --host 0.0.0.0 --port $${MATO_LOOP_BIND_FRONTEND_PORT:-10020}",
      ]
    networks:
      - mato-loop

  execution-agent:
    profiles: ["execution-agent"]
    image: mato-loop-execution-agent-dev
    build:
      context: ./apps/execution-agent
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      UV_PROJECT_ENVIRONMENT: /opt/mato-loop/execution-agent/venv
      UV_CACHE_DIR: /opt/mato-loop/execution-agent/uv-cache
      MATO_EXECUTION_AGENT_BACKEND_URL: ws://backend:${MATO_LOOP_BIND_BACKEND_PORT:-6020}/api/execution-agents/connect
      MATO_EXECUTION_AGENT_ID: ${MATO_EXECUTION_AGENT_ID:-00000000-0000-4000-8000-000000000001}
      MATO_EXECUTION_AGENT_PAIRING_TOKEN: ${MATO_EXECUTION_AGENT_PAIRING_TOKEN:-}
      MATO_EXECUTION_AGENT_TOKEN: ${MATO_EXECUTION_AGENT_TOKEN:-}
      MATO_EXECUTION_AGENT_NAME: ${MATO_EXECUTION_AGENT_NAME:-Docker Agent}
    volumes:
      - .:/source
      - ${MATO_EXECUTION_AGENT_CONFIG:-./apps/execution-agent/agent.example.json}:/config/agent.json:ro
      - ${MATO_EXECUTION_AGENT_WORKSPACE:-./data/home}:/workspace
      - execution_agent_data:/data
      - execution_agent_uv_data:/opt/mato-loop/execution-agent
    depends_on:
      backend:
        condition: service_healthy
    working_dir: /source/apps/execution-agent
    command:
      [
        "sh",
        "-c",
        "uv sync --frozen && exec uv run --no-sync mato-loop-execution-agent run --config /config/agent.json",
      ]
    networks:
      - mato-loop

volumes:
  app_data:
  db_data:
  embedding_cache:
  backend_uv_data:
  frontend_node_modules:
  frontend_yarn_cache:
  execution_agent_data:
  execution_agent_uv_data:

networks:
  mato-loop:
    name: ${MATO_LOOP_COMPOSE_PROJECT_NAME:-mato-loop}_default
